services:
  - type: web
    name: wound-segmentation-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MODEL_CHECKPOINT_PATH
        value: app/checkpoints/wound_unet.pth
        sync: false
    healthCheckPath: /health
